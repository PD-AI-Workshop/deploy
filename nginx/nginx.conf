proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=24h max_size=1g;

server {
    listen 80;
    server_name aiworkshop.su www.aiworkshop.su;
    
    server_tokens off;
    
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 120s;
    
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    client_max_body_size 100M;
    large_client_header_buffers 4 16k;
    
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
    proxy_temp_file_write_size 64k;
    
    location ~* ^/(\.env|\.git|wp-|php|\.php|config|\.ht) {
        deny all;
        return 444;
    }
    
    location ~* ^/(num\.php|ioxi-o\.php|www\.php|akcc\.php|adminfuns\.php|wp-good\.php) {
        deny all;
        return 444;
    }
    
    location /monitoring {
        proxy_pass http://grafana:3001;
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
    }
    
    location /api/ {
        proxy_pass http://backend:8000;
        
        proxy_connect_timeout 90s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 60s;
    }
    
    location / {
        proxy_pass http://frontend:3000;
        
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        location ~* _rsc= {
            proxy_pass http://frontend:3000;
            proxy_buffering off;
            proxy_cache off;
        }
    }
    
    location ~* (scan|scanner|crawler|spider|bot) {
        return 403;
    }
    
    if ($request_method = CONNECT) {
        return 405;
    }
}

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=2r/s;