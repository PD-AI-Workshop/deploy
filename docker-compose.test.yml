name: "ai-workshop-test-stack"

services:
  postgres-test:
    image: postgres:14-alpine
    restart: on-failure:5
    networks:
      - test
    container_name: ai-workshop-postgres-test
    env_file: .env.test
    volumes:
      - pgdata-test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    
  minio-test:
    image: minio/minio:latest
    restart: on-failure:5
    networks:
      - test
    container_name: ai-workshop-minioS3-test
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata-test:/data
    command: minio server /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://minio-test:9000/minio/health/ready"]
      interval: 5s
      timeout: 10s
      retries: 3

  redis-test:
    image: redis:8.2-alpine
    restart: on-failure:5
    networks:
      - test
    container_name: ai-workshop-redis-test
    volumes:
      - redisdata-test:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-test:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    restart: on-failure:3
    environment:
      - ENV=TEST
      - TESTING=API
    networks:
      - test
    container_name: ai-workshop-backend-test
    ports:
      - "8000:8000"
    command: sh -c "poetry run alembic upgrade head && poetry run uvicorn main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://backend-test:8000/api/health"]
      interval: 10s
      timeout: 10s
      retries: 3
    depends_on:
      postgres-test:
        condition: service_started
      redis-test:
        condition: service_started
      minio-test:
        condition: service_started
    logging:
      driver: json-file
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"

  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - test
    restart: on-failure
    container_name: ai-workshop-frontend-test
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://frontend-test:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      backend-test:
        condition: service_started

  nginx-test:
    build: 
      context: ./nginx/test
      dockerfile: Dockerfile
    networks:
      - test
    restart: on-failure
    container_name: ai-workshop-nginx-test
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend-test:
        condition: service_started
      frontend-test:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  miniodata-test:
  redisdata-test:
  pgdata-test:

networks:
  test:
    driver: bridge